<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxa – Painel do Cuidador (WebSocket)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --verde:#00C896; --fundo:#F1FFF3; --titulo:#093030; --azul:#6DB6FE; --vermelho:#FF4B4B; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Poppins',system-ui,sans-serif; background:var(--verde); color:var(--titulo); }
    header { padding:24px; text-align:center; }
    header h1 { margin:0; font-size:22px; }
    main { background:var(--fundo); border-radius:30px 30px 0 0; min-height:calc(100vh - 90px); padding:24px; display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
    section { background:#fff; border-radius:20px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    h2 { font-size:16px; margin:0 0 12px; }
    label { font-size:12px; display:block; margin:10px 0 4px; }
    input { width:100%; padding:10px 14px; border-radius:20px; border:0; background:#E8F8F2; font-family:inherit; }
    button { margin-top:14px; padding:10px 18px; border-radius:20px; border:0; font-family:inherit; font-weight:600; cursor:pointer; color:#fff; background:var(--verde); }
    button.emergencia { background:var(--vermelho); }
    button:disabled { opacity:.5; cursor:default; }
    #status { font-size:13px; margin-top:10px; }
    ul { list-style:none; padding:0; margin:0; max-height:60vh; overflow:auto; }
    li { border-left:6px solid var(--azul); background:var(--fundo); border-radius:12px; padding:10px 14px; margin-bottom:10px; font-size:13px; }
    li.SMS_ENVIADO { border-color:var(--verde); }
    li.SMS_FALHOU { border-color:var(--vermelho); }
    li strong { display:block; }
    .muted { color:#4B4544; font-size:12px; }
  </style>
</head>
<body>
<header><h1>Voxa – Painel do Cuidador em tempo real</h1></header>
<main>
  <section>
    <h2>1. Conectar e acompanhar um perfil</h2>
    <label for="perfil">Id do perfil (paciente)</label>
    <input id="perfil" value="22222222-2222-4222-8222-222222222222">
    <button id="conectar">Conectar</button>
    <button id="desconectar" disabled>Desconectar</button>
    <div id="status" class="muted">Desconectado.</div>

    <h2 style="margin-top:24px">2. Simular o paciente (botão de emergência)</h2>
    <label for="usuario">Id do usuário responsável</label>
    <input id="usuario" value="11111111-1111-4111-8111-111111111111">
    <label for="mensagem">Mensagem (opcional)</label>
    <input id="mensagem" placeholder="Preciso de ajuda">
    <button id="enviar" class="emergencia" disabled>Enviar alerta (/app/alerta)</button>
  </section>

  <section>
    <h2>Alertas recebidos em /topic/alertas/{perfilId}</h2>
    <ul id="alertas"><li class="muted">Nenhum alerta ainda.</li></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let client = null;

  function setStatus(texto) { $('status').textContent = texto; }

  function mostrar(evento) {
    const lista = $('alertas');
    if (lista.querySelector('.muted')) lista.innerHTML = '';
    const li = document.createElement('li');
    li.className = evento.status;
    const hora = new Date(evento.criadoEm).toLocaleTimeString('pt-BR');
    const strong = document.createElement('strong');
    strong.textContent = `${evento.perfilNome} – ${evento.status}`;
    const texto = document.createElement('div');
    texto.textContent = evento.mensagem;
    const meta = document.createElement('div');
    meta.className = 'muted';
    meta.textContent = `${hora} · telefone ${evento.telefoneMascarado ?? '—'} · alerta ${evento.alertaId}`;
    li.append(strong, texto, meta);
    lista.prepend(li);
  }

  async function carregarHistorico(perfilId) {
    const resp = await fetch(`/api/v1/alertas?perfilId=${perfilId}`);
    if (!resp.ok) return;
    const itens = await resp.json();
    itens.reverse().forEach(mostrar);
  }

  $('conectar').onclick = () => {
    const perfilId = $('perfil').value.trim();
    client = new StompJs.Client({
      webSocketFactory: () => new SockJS('/ws'),
      reconnectDelay: 3000,
      onConnect: () => {
        setStatus(`Conectado. Inscrito em /topic/alertas/${perfilId}`);
        client.subscribe(`/topic/alertas/${perfilId}`, (m) => mostrar(JSON.parse(m.body)));
        client.subscribe('/user/queue/erros', (m) => setStatus('Erro: ' + JSON.parse(m.body).erro));
        $('conectar').disabled = true;
        $('desconectar').disabled = false;
        $('enviar').disabled = false;
        carregarHistorico(perfilId);
      },
      onStompError: (f) => setStatus('Erro STOMP: ' + f.headers.message),
      onWebSocketClose: () => setStatus('Conexão encerrada.'),
    });
    client.activate();
    setStatus('Conectando...');
  };

  $('desconectar').onclick = async () => {
    await client?.deactivate();
    $('conectar').disabled = false;
    $('desconectar').disabled = true;
    $('enviar').disabled = true;
    setStatus('Desconectado.');
  };

  $('enviar').onclick = () => {
    client.publish({
      destination: '/app/alerta',
      body: JSON.stringify({
        clienteId: crypto.randomUUID(),
        usuarioId: $('usuario').value.trim(),
        perfilId: $('perfil').value.trim(),
        mensagem: $('mensagem').value.trim() || null,
        enviadoEm: new Date().toISOString(),
      }),
    });
  };
</script>
</body>
</html>
