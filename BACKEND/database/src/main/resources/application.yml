spring:

  profiles:
    active: local
    
  application:
    name: database

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quadro_comunicacao}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # O schema e criado/versionado pelo Flyway (scripts SQL em db/migration).
    # O Hibernate apenas VALIDA se as entidades batem com as tabelas existentes,
    # nunca gera ou altera DDL sozinho.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: debug
